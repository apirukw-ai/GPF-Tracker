name: Auto Update GPF NAV

on:
  schedule:
    # รันจันทร์-ศุกร์ เวลา 10:00 น. (03:00 UTC)
    - cron: '0 3 * * 1-5'
    # รันจันทร์-ศุกร์ เวลา 10:15 น. (03:15 UTC)
    - cron: '15 3 * * 1-5'
  workflow_dispatch:

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run NAV Update Script
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: python update_nav.py
