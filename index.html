<script>
        const DB_URL = "https://scb-e-class-default-rtdb.asia-southeast1.firebasedatabase.app/gpf_ports/my-gpf-4750131.json";
        const YTD_BASE_VAL = 1340202.52;
        let funds = [];
        let historyLogs = [];
        let gpfTransactions = [];
        let barChartInstance = null;
        let lineChartInstance = null;
        let detectedOcrPlans = [];

        // Mapping Table จับคู่แผนกับ fundId
        const PLAN_MAPPING = [
            { keywords: ["หุ้นไทย", "SET"], fundId: "gpf_thai" },
            { keywords: ["อสังหา", "อสังหาริมทรัพย์", "REIT"], fundId: "gpf_prop" },
            { keywords: ["ต่างประเทศ", "หุ้นต่างประเทศ"], fundId: "gpf_global" },
            { keywords: ["ตราสารหนี้"], fundId: "gpf_bond" }
        ];

        function formatNum(num) {
            return num.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function getPlanBadge(code) {
            if (!code) return '';
            if (code.includes('ตราสารหนี้') || code.includes('ตลาดเงิน')) {
                return `<span class="px-2 py-0.5 rounded text-[11px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">${code}</span>`;
            } else if (code.includes('ต่างประเทศ') || code.includes('หุ้นต่างประเทศ')) {
                return `<span class="px-2 py-0.5 rounded text-[11px] font-semibold bg-sky-500/10 text-sky-400 border border-sky-500/30">${code}</span>`;
            } else if (code.includes('อสังหา') || code.includes('REIT')) {
                return `<span class="px-2 py-0.5 rounded text-[11px] font-semibold bg-purple-500/10 text-purple-400 border border-purple-500/30">${code}</span>`;
            } else {
                return `<span class="px-2 py-0.5 rounded text-[11px] font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/30">${code}</span>`;
            }
        }

        function getFundIdByPlanName(planName) {
            const rule = PLAN_MAPPING.find(m => m.keywords.some(kw => planName.includes(kw)));
            return rule ? rule.fundId : null;
        }

        function recalculateAvgNavs() {
            if (!gpfTransactions || gpfTransactions.length === 0) return;

            funds.forEach(fund => {
                const planTxns = gpfTransactions.filter(
                    t => t.fundId === fund.id && t.type !== 'PDF_SNAPSHOT' && t.type !== 'OCR_SNAPSHOT'
                );

                if (planTxns.length > 0) {
                    const totalCost = planTxns.reduce((sum, t) => sum + (t.amount || (t.units * t.nav)), 0);
                    const totalUnits = planTxns.reduce((sum, t) => sum + t.units, 0);

                    if (totalUnits > 0) {
                        fund.avgNav = totalCost / totalUnits;
                    }
                }
            });
        }

        // 🌐 1. [NETWORK ONLY] ดึงข้อมูลสดตรงจาก Firebase เท่านั้น
        async function loadData() {
            try {
                console.log('START LOAD GPF DATA (Network Only)');
                const res = await fetch(DB_URL + '?t=' + Date.now());
                const data = await res.json();
                
                if (Array.isArray(data)) {
                    funds = data;
                } else if (data && typeof data === 'object') {
                    funds = data.funds || data.items || [];
                    historyLogs = data.history || [];
                    gpfTransactions = data.gpf_transactions || [];

                    if (data.lastUpdated) {
                        document.getElementById('lastUpdatedBadge').innerText = data.lastUpdated;
                    }
                } else {
                    funds = [];
                }

                funds = funds.filter(f => f && f.id && !f.id.startsWith('fund_'));
                
                recalculateAvgNavs();
                renderAll();
                console.log('☁️ ดึงข้อมูล GPF สดสำเร็จ');
            } catch (err) {
                console.error("Load Data Error:", err);
            }
        }

        function renderAll() {
            let totalVal = 0;
            let totalCost = 0;
            let dailyProfitSum = 0;
            let ytdValStartSum = 0;

            const tableBody = document.getElementById('fundTableBody');
            tableBody.innerHTML = '';

            const fundLabels = [];
            const fundProfitPcts = [];

            funds.forEach(f => {
                const fVal = f.units * f.currentNav;                     
                const fCost = f.units * f.avgNav;                         
                const profit = fVal - fCost;                              
                const profitPct = fCost > 0 ? (profit / fCost) * 100 : 0; 

                const prevNav = (f.prevNav !== undefined && f.prevNav !== null) ? f.prevNav : f.avgNav;
                const fValYesterday = f.units * prevNav;                 
                const todayProfitBaht = fVal - fValYesterday;            
                const todayProfitPct = fValYesterday > 0 ? (todayProfitBaht * 100) / fValYesterday : 0; 

                let ytdProfitPct = 0;
                let ytdProfitBaht = 0;
                let fValYtdStart = 0;

                if (f.ytdPct !== undefined && f.ytdPct !== null) {
                    ytdProfitPct = f.ytdPct;
                    ytdProfitBaht = (fVal * ytdProfitPct) / (100 + ytdProfitPct);
                    fValYtdStart = fVal - ytdProfitBaht;
                } else if (f.ytdNav) {
                    fValYtdStart = f.units * f.ytdNav;            
                    ytdProfitBaht = fVal - fValYtdStart;               
                    ytdProfitPct = fValYtdStart > 0 ? (ytdProfitBaht / fValYtdStart) * 100 : 0;
                } else {
                    fValYtdStart = fCost;
                    ytdProfitBaht = profit;
                    ytdProfitPct = profitPct;
                }

                totalVal += fVal;
                totalCost += fCost;
                dailyProfitSum += todayProfitBaht;
                ytdValStartSum += fValYtdStart;

                fundLabels.push(f.code);
                fundProfitPcts.push(parseFloat(profitPct.toFixed(2)));

                const safeAvgNav = f.avgNav || 0;
                const safeCurrentNav = f.currentNav || 0;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${getPlanBadge(f.code)}</td>
                    <td class="text-right font-bold text-emerald-400">${(f.units || 0).toLocaleString('th-TH', {minimumFractionDigits:4})}</td>
                    <td class="text-right font-semibold text-amber-300">฿${safeAvgNav.toFixed(4)}</td>
                    <td class="text-right text-gold font-bold">฿${safeCurrentNav.toFixed(4)}</td>
                    <td class="text-right font-semibold text-white">฿${formatNum(fVal)}</td>
                    <td class="text-right ${profit >= 0 ? 'text-green' : 'text-red'} font-medium">
                        ${profit >= 0 ? '+' : ''}฿${formatNum(profit)} (${(profitPct || 0).toFixed(2)}%)
                    </td>
                    <td class="text-right ${todayProfitBaht >= 0 ? 'text-green' : 'text-red'} font-medium">
                        ${todayProfitBaht >= 0 ? '+' : ''}฿${formatNum(todayProfitBaht)} (${todayProfitPct >= 0 ? '+' : ''}${(todayProfitPct || 0).toFixed(2)}%)
                    </td>
                    <td class="text-right ${ytdProfitBaht >= 0 ? 'text-green' : 'text-red'} font-medium">
                        ${ytdProfitBaht >= 0 ? '+' : ''}฿${formatNum(ytdProfitBaht)} (${ytdProfitPct >= 0 ? '+' : ''}${(ytdProfitPct || 0).toFixed(2)}%)
                    </td>
                    <td class="text-center">
                        <button onclick="openFundModal('${f.id}')" class="btn btn-dark p-1 rounded text-gold mr-1"><i class="fa-solid fa-pen text-[10px]"></i></button>
                        <button onclick="deleteFund('${f.id}')" class="btn btn-dark p-1 rounded text-red"><i class="fa-solid fa-trash text-[10px]"></i></button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });

            const totalProfit = totalVal - totalCost;
            const totalProfitPct = totalCost > 0 ? (totalProfit / totalCost) * 100 : 0;
            const totalDailyPct = totalVal > 0 ? (dailyProfitSum * 100) / totalVal : 0;

            const baseStartVal = YTD_BASE_VAL > 0 ? YTD_BASE_VAL : ytdValStartSum;
            const totalYtdProfitBaht = totalVal - baseStartVal;
            const totalYtdPct = baseStartVal > 0 ? (totalYtdProfitBaht / baseStartVal) * 100 : 0;

            const tableFoot = document.getElementById('fundTableFoot');
            tableFoot.innerHTML = `
                <tr>
                    <td colspan="4" class="text-left font-bold text-amber-400">ผลรวมทั้งพอร์ต (Total Summary)</td>
                    <td class="text-right font-bold text-white">฿${formatNum(totalVal)}</td>
                    <td class="text-right font-bold ${totalProfit >= 0 ? 'text-green' : 'text-red'}">
                        ${totalProfit >= 0 ? '+' : ''}฿${formatNum(totalProfit)} (${totalProfitPct.toFixed(2)}%)
                    </td>
                    <td class="text-right font-bold ${dailyProfitSum >= 0 ? 'text-green' : 'text-red'}">
                        ${dailyProfitSum >= 0 ? '+' : ''}฿${formatNum(dailyProfitSum)} (${totalDailyPct >= 0 ? '+' : ''}${totalDailyPct.toFixed(2)}%)
                    </td>
                    <td class="text-right font-bold ${totalYtdProfitBaht >= 0 ? 'text-green' : 'text-red'}">
                        ${totalYtdProfitBaht >= 0 ? '+' : ''}฿${formatNum(totalYtdProfitBaht)} (${totalYtdPct >= 0 ? '+' : ''}${totalYtdPct.toFixed(2)}%)
                    </td>
                    <td></td>
                </tr>
            `;

            document.getElementById('totalValDisplay').innerText = `฿${formatNum(totalVal)}`;
            
            const profitEl = document.getElementById('totalProfitDisplay');
            profitEl.innerText = `${totalProfit >= 0 ? '+' : ''}฿${formatNum(totalProfit)}`;
            profitEl.className = `text-xl font-extrabold ${totalProfit >= 0 ? 'text-green' : 'text-red'}`;
            document.getElementById('totalProfitSub').innerText = `${totalProfitPct >= 0 ? '+' : ''}${totalProfitPct.toFixed(2)}% จากต้นทุน`;

            const dailyEl = document.getElementById('dailyProfitDisplay');
            dailyEl.innerText = `${dailyProfitSum >= 0 ? '+' : ''}฿${formatNum(dailyProfitSum)}`;
            dailyEl.className = `text-xl font-extrabold ${dailyProfitSum >= 0 ? 'text-green' : 'text-red'}`;
            document.getElementById('dailyProfitSub').innerText = `${totalDailyPct >= 0 ? '+' : ''}${totalDailyPct.toFixed(2)}% วันนี้`;

            document.getElementById('ytdProfitDisplay').innerText = `${totalYtdPct >= 0 ? '+' : ''}${totalYtdPct.toFixed(2)}% YTD`;
            document.getElementById('ytdProfitSub').innerText = `${totalYtdProfitBaht >= 0 ? '+' : ''}฿${formatNum(totalYtdProfitBaht)} เทียบกับ 1 ม.ค. 69`;

            if (document.getElementById('lastUpdatedBadge').innerText === '-') {
                const now = new Date();
                document.getElementById('lastUpdatedBadge').innerText = now.toLocaleDateString('th-TH') + ' ' + now.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'}) + ' น.';
            }

            renderAllocation(totalVal);
            renderProfitBarChart(fundLabels, fundProfitPcts);
            renderTrendLineChart();
            renderHistoryTable(totalVal, dailyProfitSum, totalProfit);
        }

        function renderTrendLineChart() {
            const ctx = document.getElementById('trendLineChart').getContext('2d');
            if (lineChartInstance) lineChartInstance.destroy();

            let labels = historyLogs.map(l => l.timestamp ? l.timestamp.split(' ')[0] : '');
            let dataValues = historyLogs.map(l => l.totalVal);
            let costValues = historyLogs.map(l => l.totalCost !== undefined ? l.totalCost : (l.totalVal - (l.totalProfit || 0)));

            if (historyLogs.length === 0) {
                const nowStr = new Date().toLocaleDateString('th-TH');
                const totalVal = funds.reduce((acc, f) => acc + (f.units * f.currentNav), 0);
                const totalCost = funds.reduce((acc, f) => acc + (f.units * (f.costNav || f.currentNav)), 0);
                
                labels = [nowStr];
                dataValues = [totalVal];
                costValues = [totalCost];
            }

            const allValues = [...dataValues, ...costValues].filter(v => v > 0);
            const minValue = Math.min(...allValues);
            const maxValue = Math.max(...allValues);

            lineChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'มูลค่าพอร์ตรวม (บาท)',
                            data: dataValues,
                            borderColor: '#f59e0b',
                            backgroundColor: 'rgba(245, 158, 11, 0.12)',
                            fill: true,
                            tension: 0.35,
                            pointBackgroundColor: '#f59e0b',
                            pointBorderColor: '#ffffff',
                            pointHoverRadius: 6,
                            pointRadius: 4,
                            borderWidth: 2.5
                        },
                        {
                            label: 'ต้นทุนสะสม (บาท)',
                            data: costValues,
                            borderColor: '#94a3b8',
                            borderDash: [5, 5],
                            fill: false,
                            tension: 0.35,
                            pointBackgroundColor: '#94a3b8',
                            pointBorderColor: '#ffffff',
                            pointHoverRadius: 6,
                            pointRadius: 4,
                            borderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { 
                            display: true,
                            labels: { color: '#94a3b8', font: { size: 11 } }
                        },
                        datalabels: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => ` ${ctx.dataset.label}: ฿${Number(ctx.raw).toLocaleString('th-TH')}`
                            }
                        }
                    },
                    scales: {
                        y: {
                            suggestedMin: minValue * 0.95,
                            suggestedMax: maxValue * 1.05,
                            ticks: { 
                                color: '#94a3b8', 
                                font: { size: 10 },
                                callback: (val) => '฿' + (val >= 1000000 ? (val / 1000000).toFixed(2) + 'M' : (val / 1000).toFixed(0) + 'k')
                            },
                            grid: { color: '#1e293b' }
                        },
                        x: {
                            ticks: { color: '#cbd5e1', font: { size: 10 } },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        function renderProfitBarChart(labels, dataPct) {
            const ctx = document.getElementById('profitBarChart').getContext('2d');
            if (barChartInstance) barChartInstance.destroy();

            const backgroundColors = dataPct.map(val => val >= 0 ? 'rgba(16, 185, 129, 0.75)' : 'rgba(239, 68, 68, 0.75)');
            const borderColors = dataPct.map(val => val >= 0 ? '#10b981' : '#ef4444');

            const maxVal = Math.max(...dataPct, 0);
            const yMax = maxVal > 0 ? maxVal * 1.25 : undefined;

            barChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'กำไรสะสม (%)',
                        data: dataPct,
                        backgroundColor: backgroundColors,
                        borderColor: borderColors,
                        borderWidth: 1.5,
                        borderRadius: 6
                    }]
                },
                plugins: [ChartDataLabels],
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: { padding: { top: 25 } },
                    plugins: {
                        legend: { display: false },
                        datalabels: {
                            anchor: 'end',
                            align: 'top',
                            color: '#f59e0b',
                            font: { weight: 'bold', size: 11 },
                            formatter: (value) => (value >= 0 ? '+' : '') + value + '%'
                        }
                    },
                    scales: {
                        y: {
                            suggestedMax: yMax,
                            ticks: { color: '#94a3b8', font: { size: 10 } },
                            grid: { color: '#1e293b' }
                        },
                        x: {
                            ticks: { color: '#cbd5e1', font: { size: 11, weight: '600' } },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        function renderAllocation(totalVal) {
            const allocBody = document.getElementById('allocTableBody');
            allocBody.innerHTML = '';

            funds.forEach(f => {
                const fVal = f.units * f.currentNav;
                const currentPct = totalVal > 0 ? (fVal / totalVal) * 100 : 0;
                const targetPct = f.targetPct || 0;
                const diffPct = currentPct - targetPct;

                const isAlert = Math.abs(diffPct) >= 5.0;
                const progressWidth = Math.min(Math.max(currentPct, 0), 100);

                const statusBadge = isAlert
                    ? `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-red-500/20 text-red-400 border border-red-500/40 animate-pulse flex items-center justify-center gap-1"><i class="fa-solid fa-triangle-exclamation"></i> ควร Rebalance</span>`
                    : `<span class="px-2 py-0.5 rounded text-[10px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">สมดุล</span>`;

                const barColor = isAlert ? 'bg-red-500' : 'bg-amber-500';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${getPlanBadge(f.code)}</td>
                    <td class="text-right">฿${formatNum(fVal)}</td>
                    <td class="text-center align-middle">
                        <div class="flex justify-between text-[10px] text-gray-400 mb-0.5">
                            <span class="text-white font-semibold">${currentPct.toFixed(1)}%</span>
                            <span>เป้าหมาย ${targetPct.toFixed(1)}%</span>
                        </div>
                        <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden border border-slate-700">
                            <div class="${barColor} h-2 rounded-full transition-all duration-500" style="width: ${progressWidth}%"></div>
                        </div>
                    </td>
                    <td class="text-right ${diffPct >= 0 ? 'text-green' : 'text-red'} font-semibold">${diffPct >= 0 ? '+' : ''}${diffPct.toFixed(1)}%</td>
                    <td class="text-center">${statusBadge}</td>
                `;
                allocBody.appendChild(tr);
            });
        }

        function renderHistoryTable(currentTotalVal, dailyProfit, totalProfit) {
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '';

            const nowStr = new Date().toLocaleDateString('th-TH') + ' ' + new Date().toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});

            let logsToRender = historyLogs.length > 0 ? historyLogs : [
                { timestamp: nowStr, totalVal: currentTotalVal, dailyProfit: dailyProfit, totalProfit: totalProfit, status: 'Auto Sync' }
            ];

            logsToRender.slice(-5).reverse().forEach(log => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-gray-300 font-medium">${log.timestamp}</td>
                    <td class="text-right font-semibold text-white">฿${formatNum(log.totalVal)}</td>
                    <td class="text-right ${log.dailyProfit >= 0 ? 'text-green' : 'text-red'}">
                        ${log.dailyProfit >= 0 ? '+' : ''}฿${formatNum(log.dailyProfit)}
                    </td>
                    <td class="text-right ${log.totalProfit >= 0 ? 'text-green' : 'text-red'} font-semibold">
                        ${log.totalProfit >= 0 ? '+' : ''}฿${formatNum(log.totalProfit)}
                    </td>
                    <td class="text-center"><span class="px-2 py-0.5 rounded text-[10px] bg-amber-500/10 text-amber-400 border border-amber-500/30">${log.status || 'Auto Sync'}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function processPdfSnapshot(event) {
            const file = event.target.files[0];
            if (!file) return;

            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                
                let fullText = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(" ");
                    fullText += pageText + "\n";
                }

                const cleanText = fullText.replace(/\s+/g, ' ');
                let compactText = cleanText;

                for (let i = 0; i < 20; i++) {
                    compactText = compactText.replace(/([ก-๙])\s+([ก-๙])/g, '$1$2');
                }

                const THAI_MONTHS = {
                    "มกราคม":"01", "กุมภาพันธ์":"02", "มีนาคม":"03", "เมษายน":"04",
                    "พฤษภาคม":"05", "มิถุนายน":"06", "กรกฎาคม":"07", "สิงหาคม":"08",
                    "กันยายน":"09", "ตุลาคม":"10", "พฤศจิกายน":"11", "ธันวาคม":"12"
                };

                let docDate = new Date().toISOString().slice(0, 10);
                const dateMatch = compactText.match(/ณ\s*วันที่\s*(\d{1,2})\s*([ก-๙]+)\s*(\d{4})/);
                if (dateMatch) {
                    const day = dateMatch[1].padStart(2, '0');
                    const monthStr = dateMatch[2];
                    const yearTH = parseInt(dateMatch[3]);
                    
                    const month = THAI_MONTHS[monthStr] || "01";
                    const yearEN = yearTH > 2500 ? yearTH - 543 : yearTH;
                    
                    docDate = `${yearEN}-${month}-${day}`;
                }

                let updatedCount = 0;
                let navDiscrepancies = [];

                PLAN_MAPPING.forEach(rule => {
                    const fund = funds.find(f => f.id === rule.fundId);
                    if (!fund) return;

                    const regex = new RegExp(`แผน${rule.keywords[0]}[\\s\\S]*?([\\d,]+\\.\\d{4})[\\s\\S]*?([\\d,]+\\.\\d{4})[\\s\\S]*?([\\d,]+\\.\\d{2})`, "g");
                    const match = regex.exec(compactText);

                    if (match) {
                        const pdfUnits = parseFloat(match[1].replace(/,/g, ''));
                        const pdfNav = parseFloat(match[2].replace(/,/g, ''));
                        const pdfAmount = parseFloat(match[3].replace(/,/g, ''));

                        if (pdfUnits > 0) {
                            fund.units = pdfUnits; 
                            updatedCount++;

                            if (pdfNav > 0 && Math.abs(pdfNav - fund.currentNav) > 0.0001) {
                                navDiscrepancies.push(`- แผน${rule.keywords[0]}: PDF Snapshot NAV (${pdfNav.toFixed(4)}) ไม่ตรงกับ Auto NAV (${fund.currentNav.toFixed(4)})`);
                            }

                            const exists = gpfTransactions.some(t =>
                                t.type === 'PDF_SNAPSHOT' &&
                                t.fundId === fund.id &&
                                t.date === docDate
                            );
                            
                            if (!exists) {
                                gpfTransactions.push({
                                    fundId: fund.id,
                                    date: docDate,
                                    type: 'PDF_SNAPSHOT',
                                    plan: rule.keywords[0],
                                    nav: pdfNav,
                                    units: pdfUnits,
                                    amount: pdfAmount
                                });
                            }
                        }
                    }
                });

                if (updatedCount > 0) {
                    recalculateAvgNavs();
                    await saveToFirebase();
                    renderAll();

                    let alertMsg = `อัปเดตจำนวนหน่วยสะสม (units) จาก PDF Snapshot สำเร็จ ${updatedCount} แผน!`;
                    if (navDiscrepancies.length > 0) {
                        alertMsg += `\n\n⚠️ แจ้งเตือน NAV ไม่ตรงกับ Auto NAV:\n` + navDiscrepancies.join('\n');
                    }
                    alert(alertMsg);
                } else {
                    alert("ไม่พบรูปแบบข้อมูลแผนลงทุนในไฟล์ PDF สรุปพอร์ต กรุณาตรวจสอบไฟล์");
                }

            } catch (err) {
                console.error("PDF Snapshot Error:", err);
                alert("เกิดข้อผิดพลาดในการอ่านไฟล์ PDF Snapshot");
            } finally {
                event.target.value = '';
            }
        }

        async function processOcrImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusContainer = document.getElementById('ocrStatusContainer');
            const statusText = document.getElementById('ocrStatusText');
            const previewImg = document.getElementById('ocrPreviewImg');
            const spinner = document.getElementById('ocrSpinner');
            const resultForm = document.getElementById('ocrResultForm');
            const listContainer = document.getElementById('ocrPlanListContainer');

            statusContainer.classList.remove('hidden');
            resultForm.classList.add('hidden');
            spinner.classList.remove('hidden');
            statusText.innerText = "กำลังประมวลผลรูปภาพ (OCR)...";

            const objectUrl = URL.createObjectURL(file);
            previewImg.src = objectUrl;
            previewImg.classList.remove('hidden');

            previewImg.onload = async () => {
                try {
                    const worker = await Tesseract.createWorker('tha+eng');
                    const ret = await worker.recognize(file);
                    await worker.terminate();

                    let text = ret.data.text;
                    const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

                    detectedOcrPlans = [];
                    let currentPlan = null;
                    const todayStr = new Date().toISOString().slice(0, 10);

                    lines.forEach((line) => {
                        if (
                            line.includes("หุ้นไทย") ||
                            line.includes("ต่างประเทศ") ||
                            line.includes("อสังหา") ||
                            line.includes("อสังหาริมทรัพย์") ||
                            line.includes("ตราสารหนี้")
                        ) {
                            if (currentPlan && currentPlan.numbers.length >= 2) {
                                const nav = currentPlan.numbers[0];
                                const units = currentPlan.numbers[1];
                                const amount = currentPlan.numbers[2] || (nav * units);
                                const fId = getFundIdByPlanName(currentPlan.name);

                                detectedOcrPlans.push({
                                    fundId: fId,
                                    date: todayStr,
                                    nav: nav,
                                    units: units,
                                    amount: amount,
                                    planName: currentPlan.name
                                });
                            }

                            let name = "";
                            if (line.includes("หุ้นไทย")) name = "หุ้นไทย";
                            else if (line.includes("อสังหา") || line.includes("อสังหาริมทรัพย์")) name = "อสังหาริมทรัพย์";
                            else if (line.includes("ต่างประเทศ")) name = "ต่างประเทศ";
                            else if (line.includes("ตราสารหนี้")) name = "ตราสารหนี้";

                            currentPlan = { name, numbers: [] };
                        } else if (currentPlan) {
                            const nums = line.match(/[\d,]+\.\d+/g);
                            if (nums) {
                                nums.forEach(n => currentPlan.numbers.push(parseFloat(n.replace(/,/g, ''))));
                            }
                        }
                    });

                    if (currentPlan && currentPlan.numbers.length >= 2) {
                        const nav = currentPlan.numbers[0];
                        const units = currentPlan.numbers[1];
                        const amount = currentPlan.numbers[2] || (nav * units);
                        const fId = getFundIdByPlanName(currentPlan.name);

                        detectedOcrPlans.push({
                            fundId: fId,
                            date: todayStr,
                            nav: nav,
                            units: units,
                            amount: amount,
                            planName: currentPlan.name
                        });
                    }

                    listContainer.innerHTML = '';
                    document.getElementById('ocrCountBadge').innerText = `${detectedOcrPlans.length} รายการ`;

                    if (detectedOcrPlans.length === 0) {
                        statusText.innerText = "ไม่พบข้อมูลสลิปการซื้อ/สลับแผนในภาพ กรุณาถ่ายให้ชัดเจน";
                        spinner.classList.add('hidden');
                        return;
                    }

                    detectedOcrPlans.forEach((item, index) => {
                        const div = document.createElement('div');
                        div.className = "bg-slate-800/90 p-3 rounded-lg border border-slate-700 space-y-2";
                        div.innerHTML = `
                            <div class="flex justify-between items-center border-b border-slate-700/80 pb-1">
                                <span class="font-bold text-amber-400 text-xs">#${index + 1} แผน${item.planName}</span>
                                <input type="hidden" id="ocrPlanName_${index}" value="${item.planName}">
                                <input type="hidden" id="ocrFundId_${index}" value="${item.fundId || ''}">
                            </div>
                            <div class="grid grid-cols-4 gap-2">
                                <div class="col-span-4 sm:col-span-1">
                                    <label class="text-gray-400 text-[10px]">ประเภท:</label>
                                    <select id="ocrType_${index}" class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-amber-400 text-[11px] font-bold outline-none">
                                        <option value="OCR_BUY">ซื้อ/สลับเข้า (+)</option>
                                        <option value="OCR_SNAPSHOT">ยอดสะสมล่าสุด (=)</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="text-gray-400 text-[10px]">NAV วันซื้อ:</label>
                                    <input type="number" step="0.0001" id="ocrNav_${index}" value="${item.nav || ''}" class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-amber-300 font-semibold outline-none focus:border-amber-500">
                                </div>
                                <div>
                                    <label class="text-gray-400 text-[10px]">จำนวนหน่วย (Units):</label>
                                    <input type="number" step="0.0001" id="ocrUnits_${index}" value="${item.units || ''}" class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-emerald-400 font-bold outline-none focus:border-emerald-500">
                                </div>
                                <div>
                                    <label class="text-gray-400 text-[10px]">จำนวนเงิน (บาท):</label>
                                    <input type="number" step="0.01" id="ocrAmount_${index}" value="${item.amount || ''}" class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-white font-semibold outline-none focus:border-amber-500">
                                </div>
                            </div>
                        `;
                        listContainer.appendChild(div);
                    });

                    statusText.innerText = `สแกนสำเร็จ พบรายการสลับ/ซื้อทั้งหมด ${detectedOcrPlans.length} รายการ`;
                    spinner.classList.add('hidden');
                    resultForm.classList.remove('hidden');

                } catch (err) {
                    console.error("OCR Error:", err);
                    statusText.innerText = "เกิดข้อผิดพลาดในการอ่านรูปภาพ";
                    spinner.classList.add('hidden');
                }
            };
        }

        async function applyOcrData() {
            if (detectedOcrPlans.length === 0) return;

            const todayStr = new Date().toISOString().slice(0, 10);
            let updatedCount = 0;

            detectedOcrPlans.forEach((_, index) => {
                const planName = document.getElementById(`ocrPlanName_${index}`).value;
                let fundId = document.getElementById(`ocrFundId_${index}`).value || getFundIdByPlanName(planName);
                const nav = parseFloat(document.getElementById(`ocrNav_${index}`).value) || 0;
                const units = parseFloat(document.getElementById(`ocrUnits_${index}`).value) || 0;
                const amount = parseFloat(document.getElementById(`ocrAmount_${index}`).value) || (nav * units);
                const ocrType = document.getElementById(`ocrType_${index}`).value;

                if (!planName || units === 0) return;

                gpfTransactions.push({
                    fundId: fundId,
                    date: todayStr,
                    type: ocrType,
                    plan: planName,
                    nav: nav,
                    units: units,
                    amount: amount
                });

                const fund = funds.find(f => f.id === fundId || f.code.includes(planName));
                if (fund) {
                    if (ocrType === 'OCR_BUY') {
                        fund.units += units;
                    } else {
                        fund.units = units;
                    }
                }

                updatedCount++;
            });

            recalculateAvgNavs();
            await saveToFirebase();
            renderAll();
            closeOcrModal();
            alert(`บันทึก gpf_transactions สำเร็จ ${updatedCount} รายการ และคำนวณ avgNav ใหม่เรียบร้อยแล้ว!`);
        }

        function openFundModal(id = null) {
            document.getElementById('editFundId').value = id || '';
            const avgNavInput = document.getElementById('inputAvgNav');

            if (id) {
                const f = funds.find(item => item.id === id);
                if (f) {
                    document.getElementById('modalTitle').innerText = "แก้ไขแผนลงทุน";
                    document.getElementById('inputCode').value = f.code || '';
                    document.getElementById('inputAvgNav').value = f.avgNav || '';
                    document.getElementById('inputCurrentNav').value = f.currentNav || '';
                    document.getElementById('inputUnits').value = f.units || '';
                    document.getElementById('inputTargetPct').value = f.targetPct || 0;
                    
                    avgNavInput.setAttribute('readonly', true);
                    avgNavInput.classList.add('opacity-50', 'cursor-not-allowed');
                }
            } else {
                document.getElementById('modalTitle').innerText = "เพิ่มแผนลงทุน";
                document.getElementById('inputCode').value = '';
                document.getElementById('inputAvgNav').value = '';
                document.getElementById('inputCurrentNav').value = '';
                document.getElementById('inputUnits').value = '';
                document.getElementById('inputTargetPct').value = '';
                
                avgNavInput.removeAttribute('readonly');
                avgNavInput.classList.remove('opacity-50', 'cursor-not-allowed');
            }
            document.getElementById('fundModal').classList.remove('hidden');
        }

        function closeFundModal() { document.getElementById('fundModal').classList.add('hidden'); }
        function openOcrModal() { document.getElementById('ocrModal').classList.remove('hidden'); }
        function closeOcrModal() { 
            document.getElementById('ocrModal').classList.add('hidden'); 
            document.getElementById('ocrStatusContainer').classList.add('hidden');
            document.getElementById('ocrResultForm').classList.add('hidden');
            document.getElementById('fileInput').value = '';
        }

        async function saveFund() {
            const id = document.getElementById('editFundId').value;
            const code = document.getElementById('inputCode').value;
            const avgNav = parseFloat(document.getElementById('inputAvgNav').value) || 0;
            const currentNav = parseFloat(document.getElementById('inputCurrentNav').value) || avgNav;
            const units = parseFloat(document.getElementById('inputUnits').value) || 0;
            const targetPct = parseFloat(document.getElementById('inputTargetPct').value) || 0;

            if (id) {
                const f = funds.find(item => item.id === id);
                if (f) {
                    f.code = code;
                    f.currentNav = currentNav;
                    f.units = units;
                    f.targetPct = targetPct;
                }
            } else {
                const newFundId = 'gpf_fund_' + Date.now();
                funds.push({
                    id: newFundId,
                    code: code,
                    avgNav: avgNav,
                    currentNav: currentNav,
                    units: units,
                    targetPct: targetPct
                });

                if (units > 0 && avgNav > 0) {
                    gpfTransactions.push({
                        fundId: newFundId,
                        date: new Date().toISOString().slice(0, 10),
                        type: 'INITIAL',
                        plan: code,
                        nav: avgNav,
                        units: units,
                        amount: units * avgNav
                    });
                }
            }

            await saveToFirebase();
            closeFundModal();
            renderAll();
        }

        async function deleteFund(id) {
            if (confirm("คุณต้องการลบแผนลงทุนนี้ใช่หรือไม่?")) {
                funds = funds.filter(f => f.id !== id);
                gpfTransactions = gpfTransactions.filter(t => t.fundId !== id);
                await saveToFirebase();
                renderAll();
            }
        }

        function exportCSV() {
            if (!funds || funds.length === 0) return alert("ไม่มีข้อมูลสำหรับส่งออก");
            
            let csvContent = "\uFEFF";
            csvContent += "ชื่อแผนลงทุน,NAV ต้นทุนถัวเฉลี่ย,NAV ปัจจุบัน,จำนวนหน่วย,มูลค่าปัจจุบัน(บาท),กำไรสะสม(บาท),สัดส่วนเป้าหมาย(%)\n";

            funds.forEach(f => {
                const fVal = f.units * f.currentNav;
                const fCost = f.units * f.avgNav;
                const profit = fVal - fCost;
                const codeName = `"${(f.code || '').replace(/"/g, '""')}"`;
                csvContent += `${codeName},${f.avgNav.toFixed(4)},${f.currentNav.toFixed(4)},${f.units},${fVal.toFixed(2)},${profit.toFixed(2)},${f.targetPct || 0}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", url);
            downloadAnchor.setAttribute("download", `gpf_portfolio_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            document.body.removeChild(downloadAnchor);
        }

        // 🚫 2. ถอนสิทธิ์การยิง PUT ออกจากหน้าเบราว์เซอร์
        async function saveToFirebase() {
            console.log('💾 Data processed locally (Cloud write handled via Server/Actions)');
        }

        loadData();
       
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('PWA Ready'))
                    .catch(err => console.error('SW Error:', err));
            });
        }
    </script>
