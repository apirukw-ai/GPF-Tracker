name: Auto Update GPF NAV

on:
  schedule:
    # รันจันทร์-ศุกร์ เวลา 18:10 น. (11:10 UTC)
    - cron: '10 11 * * 1-5'
    # รันจันทร์-ศุกร์ เวลา 18:30 น. (11:30 UTC)
    - cron: '30 11 * * 1-5'
  workflow_dispatch:

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run NAV Update Script
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: python update_nav.py
