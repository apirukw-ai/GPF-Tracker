name: Update NAV

on:
  schedule:
    # 1. Dime: 05:00 น. เวลาไทย (เช้า อ.-ส.) -> UTC 22:00 น. (จ.-ศ.)
    - cron: '0 22 * * 1-5'
    
    # 2. GPF: 10:00 น. เวลาไทย (จ.-ศ.) -> UTC 03:00 น. (จ.-ศ.)
    - cron: '0 3 * * 1-5'

  workflow_dispatch:

jobs:
  update-nav:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase requests beautifulsoup4 yfinance

      - name: Run NAV Update Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python update_nav.py
